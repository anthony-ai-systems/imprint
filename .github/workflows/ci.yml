name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract:
    name: Python ${{ matrix.python }} contract
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Gitleaks scans the full commit history; a shallow checkout
          # would silently truncate the scan.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,release]'
      - run: bash tests/acceptance/test_upgrade_from_v300.sh
      # gitleaks-action requires a GITLEAKS_LICENSE on organization-owned
      # repos; the gitleaks CLI itself is MIT-licensed, so run it directly,
      # pinned by version and release-asset checksum.
      - name: Run gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .
      - run: python tools/release/scan_public.py
      - run: python tools/release/package.py
      - name: Prove deterministic rebuild
        run: |
          cp release-artifacts/SHA256SUMS /tmp/first-SHA256SUMS
          python tools/release/package.py
          diff -u /tmp/first-SHA256SUMS release-artifacts/SHA256SUMS
      - run: python tools/release/verify_artifacts.py release-artifacts --expected-revision "$(git rev-parse HEAD)" --source-root .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imprint-release-candidate
          path: release-artifacts/
          if-no-files-found: error

  artifact-posix:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (not Blacksmith): the Empty-HOME acceptance test depends on
        # stock login-shell profile sourcing, which the Blacksmith image alters.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imprint-release-candidate
          path: candidate
      - run: python tools/release/verify_artifacts.py candidate --expected-revision "$(git rev-parse HEAD)" --source-root .
      - name: Extract tar artifact
        run: python tools/release/extract_safe.py candidate/imprint-3.0.1.tar.gz extracted
      - name: Empty-HOME artifact acceptance
        run: bash extracted/imprint-3.0.1/tests/acceptance/test_install_posix.sh

  artifact-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imprint-release-candidate
          path: candidate
      - shell: pwsh
        run: python tools/release/verify_artifacts.py candidate --expected-revision "$(git rev-parse HEAD)" --source-root .
      - name: Extract ZIP artifact
        shell: pwsh
        run: python tools/release/extract_safe.py candidate/imprint-3.0.1.zip extracted
      - name: Genuine Windows empty-profile acceptance
        shell: pwsh
        run: ./extracted/imprint-3.0.1/tests/acceptance/test_install_windows.ps1
